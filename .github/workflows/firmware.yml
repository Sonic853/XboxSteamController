name: Build SC2015 firmware

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner (x86-64)
        type: choice
        options:
          - ubuntu-22.04
          - windows-2022
        default: ubuntu-22.04
      firmware_zip_url:
        description: Optional HTTPS mirror of the exact pinned Valve ZIP
        type: string
        required: false
        default: ''

# Serialize date-version selection through publication, across all branches.
concurrency:
  group: sc2015-date-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Choose Beijing-date release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect all tags and releases
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/release.py next

  firmware:
    needs: version
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser protocol tests
        run: node --test tests/test_web.mjs
      - name: Fetch and verify pinned dependencies
        env:
          FIRMWARE_ZIP_URL: ${{ inputs.firmware_zip_url }}
        run: python tools/dependencies.py
      - name: Install pinned ARM emulator for tests
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps --target .tools/python unicorn==2.1.4
      - name: Build LPC and nRF firmware
        run: python tools/build.py --base-dir .tools/base --toolchain-bin .tools/gcc/bin
      - name: All tests including ARM execution
        env:
          PYTHONPATH: .tools/python
          XSC_REQUIRE_ARM_TESTS: '1'
          XSC_REQUIRE_EMULATION: '1'
        run: python -m unittest discover -s tests -v
      - name: Upload firmware and build records
        uses: actions/upload-artifact@v4
        with:
          name: SC2015-firmware-${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/host.bin
            build/radio.bin
            build/host-payload.elf
            build/radio-payload.elf
            build/manifest.json
            build/SHA256SUMS

  publish:
    name: Verify and publish date release
    needs: [version, firmware]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download tested firmware from this run
        uses: actions/download-artifact@v4
        with:
          name: SC2015-firmware-${{ inputs.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build
      - name: Verify and package versioned downloads
        run: python tools/release.py package
      - name: Reserve tag, upload draft, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py publish
